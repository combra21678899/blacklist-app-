name: Tests y Cobertura

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================
  # JOB 1: Pruebas unitarias con pytest
  # ============================================
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blacklist_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar Poetry
        run: pip install poetry
      
      - name: Configurar Poetry
        run: poetry config virtualenvs.create false
      
      - name: Instalar dependencias
        run: poetry install --with dev
      
      - name: Configurar variables de entorno
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/blacklist_db" >> $GITHUB_ENV
          echo "BEARER_TOKEN=test-token-12345" >> $GITHUB_ENV
      
      - name: Ejecutar pruebas con cobertura
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml
      
      - name: Verificar cobertura (minimo 90%)
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); print(root.attrib['line-rate'])")
          COVERAGE_PCT=$(python -c "print(round(float('$COVERAGE')*100, 2))")
          echo "Cobertura: $COVERAGE_PCT%"
          if (( $(echo "$COVERAGE_PCT < 90" | bc -l) )); then
            echo "ERROR: Cobertura $COVERAGE_PCT% es menor que 90%"
            exit 1
          else
            echo "OK: Cobertura $COVERAGE_PCT% - Minimo alcanzado"
          fi

  # ============================================
  # JOB 2: Pruebas de integracion con Newman
  # ============================================
  pruebas_integracion:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
      
      - name: Crear archivo .env para CI
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/blacklist_db" > .env
          echo "BEARER_TOKEN=dev-token-12345" >> .env
          echo "FLASK_ENV=development" >> .env
          echo "FLASK_APP=src.main" >> .env
          echo "PORT=5000" >> .env
      
      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --build
      
      - name: Esperar a que la app este lista
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5001/blacklists/ping | grep -q pong; then
              echo "App lista"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: La app no respondio"
          docker compose logs
          exit 1
      
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar Newman
        run: npm install -g newman
      
      - name: Ejecutar pruebas de integracion con Newman
        run: |
          newman run blacklist-api.postman_collection.json \
            --env-var baseUrl=http://localhost:5001 \
            --env-var token=dev-token-12345
      
      - name: Detener servicios
        if: always()
        run: docker compose down